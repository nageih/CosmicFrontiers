# This is the name of your workflow, which will appear in the GitHub Actions tab.
name: Hello World Workflow (Push to Test & Manual Dispatch)

# This defines when the workflow should run.
on:
  # Trigger on push events
  push:
    # Specifically for the 'test' branch
    branches:
      - mrquentin-patch-1

  # Trigger manually from the GitHub Actions tab
  workflow_dispatch:
    # You can optionally define inputs here if you need them for manual runs.
    # For a simple hello world, no inputs are strictly necessary,
    # but I'll add an example string input for demonstration.
    inputs:
      message:
        description: 'A custom message for the workflow'
        required: false
        type: string
        default: 'No custom message provided.'

# A workflow is made up of one or more jobs.
jobs:
  my-hello-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Hello Message
        # Access the workflow_dispatch input if it's a manual run,
        # otherwise use a default message.
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Hello, GitHub Actions from a manual dispatch!"
            echo "Custom Message: ${{ github.event.inputs.message }}"
          else
            echo "Hello, GitHub Actions from a push to 'test' branch!"
          fi

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la
